<!DOCTYPE html>
<html>

<head>
    <title>EB Bill Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>EB BILL CALCULATOR</h1>

    <label>Enter Units:</label>
    <input type="number" id="units">

    <button onclick="calculateBill()">Calculate</button>

    <p id="result"></p>

    <script>

        function calculateBill() {

            let units = Number(document.getElementById("units").value);
            let amount = 0;

            if (units <= 200) { 

                amount="your eb bill is free"
                document.getElementById("result").innerHTML="your EB bill is free";
            }

            else if (units <= 400) {
                amount = (units - 200) * 4.70;
                document.getElementById("result").innerHTML="your EB bill amount is";
            }

            else if (units <= 500) {
                amount = (200 * 4.70) + (units - 400) * 6.30;
                
            }

            else if (units <= 600) {

                amount = (300 * 4.70) + (100 * 6.30)
                       + (units-500) * 8.40;               
            }
            else if (units <= 800) {
                amount = (300 * 4.70) + (100 * 6.30)
                       + (100 * 8.40)
                       + (units - 600) * 9.45;
            }

            else if (units <= 1000) {

                amount = (300* 4.70) + (100 * 6.30)
                       + (100 * 8.40) + (200 * 9.45)
                       + (units - 800) * 10.50;
                       
            }

            else {

                amount = (300* 4.70) + (100 * 6.30)
                       + (100 * 8.40) + (200 * 9.45)
                       + (200 * 10.50)
                       + (units - 1000) * 11.55;          
            }
            document.getElementById("result").innerHTML =
                "EB Bill Amount = Rs " + amount;
        }
    </script>
</body>
</html>
