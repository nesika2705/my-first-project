<!DOCTYPE html>
<html>
    <head>
        <title>
            sort method
        </title>
    </head>
    <body>
        <h2>sort method></h2>
        <p id="demo"></p>
        <button type="button" onclick="myfunction()">try it
        </button>
        <script>
         const points=[40,50,100,25,1,5,10];
         document.getElementById("demo").innerHTML=points;
         function myfunction(){
            for (let i=points.length-1;i>0;i--){
                let j=Math.floor(Math.random()*(i+1));
                let k=points[i];
                points[i]=points[j];
                points[j]=k;
            }
            document.getElementById("demo").innerHTML=points;
         }
        </script>
    </body>
</html>
