<!DOCTYPE html>
<html>
    <head>
        <title>array properties</title>
    </head>
    <body>
             <h2>push()method</h2>
   <button onclick="myfunction()">tryit</button>
   <p id="demo"></p>
   <script>
    const fruit=["banana","apple","orange","mango"];
    document.getElementById("demo").innerHTML=fruit;
    function myfunction(){
        fruit.push("lemon");
        document.getElementById("demo").innerHTML=fruit;
    }
   </script>
    </body>
</html>
